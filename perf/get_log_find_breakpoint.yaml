config:
  http:
    pool: 1000
    timeout: 10
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-log-normal"
    docker-normal:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-normal"
    docker-100:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-100"
    docker-500:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-500"
    docker-1k:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-1k"
    docker-2k:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-2k"
    docker-5k:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-5k"
    docker-20k:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-20k"
    docker-40k:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-40k"
    docker-100k:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-log-100k"

  phases:
    - name: Warm-up
      duration: 20
      arrivalRate: 5

    - name: Plateau 250
      duration: 60
      arrivalRate: 250

    - name: Plateau 350
      duration: 60
      arrivalRate: 350

    - name: Plateau 400
      duration: 60
      arrivalRate: 400

    - name: Plateau 450
      duration: 60
      arrivalRate: 450

    - name: Plateau 500
      duration: 60
      arrivalRate: 500

    - name: Ramp-down
      duration: 30
      arrivalRate: 500
      rampTo: 10

    - name: Cooldown
      duration: 30
      arrivalRate: 10

scenarios:
  - name: GET Log (/log)
    flow:
      - get:
          url: '/log'
