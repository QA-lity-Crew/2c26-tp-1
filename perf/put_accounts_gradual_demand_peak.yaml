config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  pool: 200

  phases:
    - name: Warm-up
      duration: 20
      arrivalRate: 5

    - name: Normal trading
      duration: 60
      arrivalRate: 50

    - name: Gradual use of updates
      duration: 120
      arrivalRate: 50
      rampTo: 600

    - name: Recovery
      duration: 60
      arrivalRate: 600
      rampTo: 50

    - name: Cooldown
      duration: 30
      arrivalRate: 10

scenarios:
  - name: Update balance (PUT /accounts/4/balance)
    flow:
      - put:
          # Siempre sobre la última cuenta del array obtenido en el código inicial.
          # Si tuvieramos una cantidad considerable, sería de interés comparar esta prueba
          # para ambos casos (el primer y el último del array) pero dado que son únicamente 4 casos
          # será despreciable la diferencia (podría ser evaluado en caso de tener un endpoint donde sean
          # creadas las accounts).
          url: '/accounts/4/balance'
          json:
            balance: 60000
          expect:
            - statusCode: 200
            - contentType: json