limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

upstream api { 
    server exchange-api-1:3000;
}

server {
    listen 80;

    # Bound concurrent work created by a single client.
    limit_conn connections_per_ip 20;

    # API payloads are small. Reject oversized or deliberately slow requests
    # before they consume application memory and processing time.
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 10s;

    location / {
        limit_req zone=api_rate_limit burst=20 nodelay;

        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
