limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=3000r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

upstream exchange_api {
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
    server api3:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    limit_conn connections_per_ip 20;

    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 10s;

    location / {
        limit_req zone=api_rate_limit burst=600 nodelay;

        proxy_pass http://exchange_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una instancia cae, reintenta en otra.
        proxy_next_upstream error timeout;

        # Este header está para ver en Postman el balanceo de carga.
        add_header X-Served-By $upstream_addr always;
    }
}
