services:
    api:
      build: ./app
      cpus: "1.0"
      mem_limit: 512m
      environment:
        PERF_ACCOUNT_COUNT: ${PERF_ACCOUNT_COUNT:-0}
        PERF_LOG_COUNT: ${PERF_LOG_COUNT:-0}

    nginx:
        image: nginx:1.29.8
        ports:
            - "5555:80"
        volumes:
            - ./nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro
            - ./store/static/files:/static:ro
        links:
            - api

    graphite:
        image: graphiteapp/graphite-statsd:1.1.10-5
        volumes:
            - ./statsd.config.json:/opt/statsd/config/udp.js
            - ./graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
        ports:
            - "8090:80"
            - "8125:8125/udp"
            - "8126:8126"

    grafana:
        image: grafana/grafana:11.5.10
        ports:
            - "80:3000"
        volumes:
            - "grafana_config:/var/lib/grafana"

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.51.0
        links:
            - graphite
        command: -storage_driver="statsd" -storage_driver_host="graphite:8125" -storage_driver_db="cadvisor" -storage_driver_buffer_duration="1s" --docker_only=true
        ports:
            - "8080:8080"
        volumes:
            - "/:/rootfs:ro"
            - "/var/run:/var/run:rw"
            - "/sys:/sys:ro"
            - "/var/lib/docker/:/var/lib/docker:ro"

    resource-metrics:
        image: node:24
        command: ["node", "/opt/resource_metrics.cjs"]
        environment:
            COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-exchange}
            STATSD_HOST: graphite
        volumes:
            - ./perf/resource_metrics.cjs:/opt/resource_metrics.cjs:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        depends_on:
            - graphite
        restart: unless-stopped

    loadgen:
        image: node:22-alpine
        profiles: ["load"]
        working_dir: /perf
        volumes:
            - ./perf:/perf
            - loadgen_node_modules:/perf/node_modules
        command: ["sh", "-c", "npm ci && ./run-scenario.sh get_rates_find_breakpoint docker"]
        depends_on:
            - nginx
            - graphite

volumes:
    grafana_config:
        driver: local
    loadgen_node_modules:
        driver: local
