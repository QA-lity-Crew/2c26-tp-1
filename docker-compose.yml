services:
    api1: &api
        build: ./app
        cpus: "1.0"
        mem_limit: 512m
        environment:
            - INSTANCE_ID=api1
            - REDIS_URL=redis://redis:6379
        depends_on:
            - redis
    api2:
        <<: *api
        environment:
            - INSTANCE_ID=api2
            - REDIS_URL=redis://redis:6379
    api3:
        <<: *api
        environment:
            - INSTANCE_ID=api3
            - REDIS_URL=redis://redis:6379

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
        - redis_data:/data

    nginx:
        image: nginx:1.29.8
        ports:
            - "5555:80"
        volumes:
            - ./nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro
            - ./store/static/files:/static:ro
        depends_on:
            - api1
            - api2
            - api3

    graphite:
        image: graphiteapp/graphite-statsd:1.1.10-5
        volumes:
            - ./statsd.config.json:/opt/statsd/config/udp.js
            - ./graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
        ports:
            - "8090:80"
            - "8125:8125/udp"
            - "8126:8126"

    grafana:
        image: grafana/grafana:11.5.10
        ports:
            - "80:3000"
        volumes:
            - "grafana_config:/var/lib/grafana"

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.51.0
        privileged: true
        devices:
            - /dev/kmsg
        links:
            - graphite
        command: 
            - '-storage_driver=statsd'
            - '-storage_driver_host=graphite:8125'
            - '-storage_driver_db=cadvisor'
            - '-storage_driver_buffer_duration=1s'
            - '--docker_only=true'
            - '--disable_metrics=disk,diskIO'
        ports:
            - "8080:8080"
        volumes:
            - "/:/rootfs:ro"
            - "/var/run:/var/run:rw"
            - "/sys:/sys:ro"
            - "/var/lib/docker/:/var/lib/docker:ro"
            - "/dev/disk/:/dev/disk:ro"

volumes:
    grafana_config:
        driver: local
    redis_data:
        driver: local